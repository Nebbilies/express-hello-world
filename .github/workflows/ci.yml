name: Node.js CI Pipeline

on:
  push:
    branches: [ "main", "feature/devops" ]
  pull_request:
    branches: [ "main" ]
  
jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test 

      - name: Build Docker Image
        run: |
          docker build -t express-hello-world:${{ github.sha }} .
          docker tag express-hello-world:${{ github.sha }} express-hello-world:latest

      - name: Notify success
        if: success()
        run: |
          echo "Pipeline completed successfully" >> $GITHUB_STEP_SUMMARY
          
      - name: Notify Failure
        if: failure()
        run: |
          echo "Pipeline failed!" >> $GITHUB_STEP_SUMMARY